name: Atualizar cotações LME diariamente

on:
  # Roda todo dia às 11:05 UTC = 08:05 BRT
  schedule:
    - cron: '5 11 * * *'
  # Permite disparar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Atualizar preços Westmetall
        run: node update-prices.js

      - name: Commit das mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar."
          else
            git commit -m "Atualização automática de preços — $(TZ='America/Sao_Paulo' date +'%d/%m/%Y %H:%M BRT')"
            git push
          fi
